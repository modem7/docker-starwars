name: Lint Dockerfile

on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/lint.yml
  workflow_dispatch:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run hadolint
        run: |
          docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:latest-alpine \
            sh -c "hadolint --version && hadolint Dockerfile"
